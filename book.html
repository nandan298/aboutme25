<!DOCTYPE html>
<html>
<head>

  <title>Book</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #EBEBEB;
    }

    /* Header */
    #header {
      background-color: black;
      height: 100px;
      width: 100%;
    }

    .container {
      width: 960px;
      height: auto;
      margin: 0 auto;
    }

    #logo-area {
      width: 300px;
      height: 100px;
      background: url('web.png') no-repeat;

    }

    }

    #nav {
      list-style: none;
      margin-top: 30px;
    }

    #nav li {
      float: left;
      margin-left: 30px;
    }

    #nav a {
      color: white;
      text-decoration: none;
      background-color: #252525;
      padding: 8px;
      border: 1px solid silver;
      border-radius: 5px;
    }

    #nav li:hover a {
      background-color: gray;
    }

    /* Main Content */6
    #main-area {
      padding: 40px 0;
    }

    .page {
      background-color: white;
      padding: 20px;
      padding-bottom: 1px;
    }

    .page p {
      margin-bottom: 20px;
    }

    /* Footer */
    #footer {
      background-color: black;
      color: white;
      width: 100%;
      height: 40px;
    }

    #footer .container {
      padding-top: 20px;
    }
  </style>
</head>

  <div id="header">
